<h2>Add Contact</h2>
<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<button onclick="add()">Add</button>

<script>
async function add() {
  await fetch('/add-contact', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + localStorage.getItem('token')
    },
    body: JSON.stringify({
      name: name.value,
      phone: phone.value
    })
  });
  alert('Added');
}
</script>
